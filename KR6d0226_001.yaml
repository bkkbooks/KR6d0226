body:
  text: 天竺寺懺主慈雲大師勑諡法寶大法師述住持傳天台教觀五世法孫慈明大師慧觀重編授菩薩戒儀式十科授五戒法示人念佛方法并悔願文修盂蘭盆方法九門授菩薩戒儀式十科第一開導信心第二請三寶諸天加護第三歸依三寶第四請五聖師第五下座佛前乞戒第六發四弘誓願第七開遮問難第八三番羯磨第九請佛證明第十示持犯戒相第一開導信心原夫大乘菩薩戒者菩薩道之根本正覺果之因基故梵網經云戒如明日月亦如瓔珞珠微塵衆菩薩由是成正覺華嚴經云戒是無上菩提本應當具足持淨戒若能堅持於淨戒是則如來所讚歎涅槃經云欲見佛性證大涅槃必須受其戒法當知若不受戒無成佛之期智度論云如無足欲行無船欲渡是不可得薩遮尼乾子經云若不持戒乃至不得疼癩野干之身況功德之身又月燈三昧經云雖有色族及多聞若無淨戒猶禽獸雖處卑下少聞見能持淨戒名勝士又瓔珞經云若一切衆生不受菩薩戒者不名為人畜生無異故知戒德殊勝不可思議為五乘之軌範作三寶之梯航大惡病之良藥大怖畏之守護惡道暗處戒為明燈生死海中戒為船筏諸佛子欲求此戒須發信心華嚴經云信是道源功德母長養一切諸善根當知信心為萬善之本今所發信心者須信現前一念即大乘菩薩戒體故瓔珞經云一切凡聖戒皆以心為本心無盡故戒亦無盡然戒有多種五戒八關齋戒名近住解脫戒若受此戒但近代天之報小乘二百五十戒名別別解脫戒若受此戒每恃一條各得解脫雖出離生死愛河但趣阿羅漢小果不能明常住佛性廣化衆生若受菩薩三聚淨戒報圓佛果相好無邊三達五眼十力四無所畏一切功德無不具足故受茲戒法即於凡夫此身一念之中訖至成佛具八種殊勝現世獲五種利益云何為五一者得諸佛諸大菩薩心心護念時時記持二者得煩惱斷除佛心明朗智慧辨才漸漸增長三者得現在人見心生歡喜一切善心倍加恭敬四者得備萬行猶如妙華莊嚴凡夫位齊古佛五者臨命終時心無悔惱神識安然捨此報身直生佛淨土八種殊勝者第一趣道殊勝者譬如大鵬一舉翅高飛能至十萬九千里喻此菩薩趣道徑疾故法華經云乘是寶乘直至道場又華嚴經云以少方便而得菩提當知但了一心名少方便更無所至當體湛然第二發心殊勝者諦了初心當念成佛因果同時譬如好堅處地內煩惱㲉中能發此心已超二乘果位故云小乘之極不如大乘之初第三福田殊勝者假使供養滿閻浮提阿羅漢不如供養一鵬何以故此鳥先曾受菩薩戒故第四功德殊勝者受菩薩戒者喻如日光受小乘戒者喻如螢火第五受罪輕微者諸弟子莫疑受戒堅持不得不敢受戒經云受戒之後設若破戒猶勝外道不受戒者外道邪見永沉惡道無有出期破戒之人戒威力故設墮惡道受罪輕微若墮地獄作地獄中王若墮畜生作畜生中王若墮神鬼作神鬼中王若在人間作人中王若生天上作天中王生生之處不失王位經云有犯名菩薩有戒可破故無犯名外道無戒可破故第六處胎殊勝者菩薩處胎之時常為天龍八部諸善神王之所守護不令敗壞第七神通殊勝者菩薩於一切處而得解脫小乘之人止得三明六道具八解脫但離虗妄名為解脫其實未得一切解脫第八果報殊勝者生蓮華藏海受法性身湛然常住無生無滅以念念趣薩婆若海成無上菩提第二請三寶諸天加護諸佛子既知妙戒如是功德開導身心須至欣慕次當教汝虔請三寶及諸天神祇同降道場證明護念同崇戒法汝等各各至心隨我口道弟子某甲一心奉請十方三世一切諸佛真應二身一切尊法半滿兩教一切聖賢三乘等侶惟願三寶同降道場證明加護一心奉請梵釋四王二十八天諸仙仙衆大宋土境名山大川江河淮濟一切神祇當州地分城隍社廟一切靈宰僧伽藍內護正法者並願承三寶力同降道場證明加護第三歸依三寶如上已為汝請三寶百靈降臨道場同崇戒善菩薩戒法不問是男是女若顯若幽乃至利根畜生但解法師語者盡受得菩薩戒法不同小乘於受戒時但言盡形壽此身若謝其戒便失若是菩薩戒從今一受訖至成佛永無失緣向下為諸弟子翻邪向正受三歸依言三歸者一歸依佛寶二歸依法寶三歸依僧寶此之三寶是衆生敬田若也歸依而敬之能生一切功德然三寶有乎三種一住持三寶二別相三寶三一體三寶言住持三寶亦曰相從三寶自釋迦去後至今不絶泥龕塑像即佛寶黃卷赤軸為法寶剃髮染衣名僧寶言別相三寶者修行契證方便則有未修行則無妙覺如來具法身報身應身化身此之四身是其佛寶所説八萬四千法藏是法寶等覺已還諸位菩薩一切聲聞等是僧寶言一體三寶者上至諸佛下及蜎飛無不具是三寶也實相圓理無為一體即一而三名祕密藏如世珍奇通名為寶即今弟子有其覺性便是佛寶此性無染便是法寶此性柔和無諍便是僧寶諸弟子不得自輕諸佛如來只因證此三寶而能運大神通興諸佛事諸弟子此之三寶在己身中如水在冰若向冰外求水無有是處然若欲融冰善須方便擬趣佛果非修不成今始覺知正向此寶作歸依處隨我聲唱各稱己名我弟子某甲等願從今日盡未來際歸依佛兩足尊歸依法離欲尊歸依僧衆中尊三説上來已為受歸依竟向下更須三度結歸若不結歸則向歸依不稱圓滿隨我聲唱我弟子某甲等歸依佛竟歸依法竟歸依僧竟三説從今已往稱佛為師更不歸依邪魔外道惟願三寶哀憐攝受慈愍故三説第四請五聖師諸佛子汝等欲求妙戒先須請師次為汝虔請五座聖師授汝戒法汝等各須至心殷勤三請請師之法汝合自陳蓋汝未能我今教汝合掌稱名隨我言道我某甲等一心奉請釋迦如來應正等覺為和尚我依和尚故得受菩薩戒慈愍故三説一心奉請文殊師利菩薩為羯磨阿闍梨我依羯磨阿闍梨故得受菩薩戒慈愍故一心奉請彌勒菩薩為教授阿闍梨我依教授阿闍梨故得受菩薩戒慈愍故一心奉請十方諸佛為尊證師我依尊證師故得受菩薩戒慈愍故一心奉請諸大菩薩為同學侶我依同學侶故得受菩薩戒慈愍故諸弟子和尚阿闍梨十方尊證師諸大同學悉具無緣慈悲拔苦與樂更為弟子要期何故須要期慮諸弟子受戒之後不能堅持破戒得罪墮落惡道一時唱云我若隨三惡道中和尚阿闍梨十方尊證師十方諸大同學慈悲度脫三説第五下座佛前乞戒諸佛子我今為汝三白諸佛菩薩乞戒汝等至心合掌諦聽戒師下佛前跪唱云仰白十方一切諸佛大地菩薩僧此諸弟子求我比丘某甲從諸佛菩薩僧乞受菩薩三聚淨戒此諸弟子已是真實能生淨信成菩提種惟願慈悲施與菩薩三聚淨戒第六發四弘誓願諸佛子將欲授汝妙戒先須真正發菩提心立四弘誓願須歸依諦境要制其心自行化他從因至果然此諦境及菩提心通於大小汝今既求大乘三聚淨戒須依圓頓無作諦境生死即涅槃煩惱即菩提即或成智即生成滅依此諦境立四弘誓願融攝大小無非法界初心遍攝觀惑法界遍集佛法三身等證汝等當須心緣諦境口陳誓詞合掌志心隨我口道唱云衆生無邊誓願度煩惱無數誓願斷法門無盡誓願學佛道無上誓願成第七問遮難次當依梵網經問汝遮難若有七遮之罪以為障難不得三聚淨戒我今問汝當如實答汝曾出佛身血否答云無下去例此答汝曾殺父否汝曾殺母否汝曾殺阿闍梨否汝曾殺和尚否汝曾殺阿羅漢否汝曾破和合僧否第八羯磨諸佛子既無遮難方堪受戒今正是時切須至心傾仰於師如仰完器盛水無異莫餘思想一心諦聽三番羯磨唱第一番法界善芽悉皆震動欲住汝身唱第二番此之戒法遍滿虗空雲集項上唱第三番想此戒法從汝頂門而入身心滿足非色非心不可思議汝等直須靜思靜慮諦聽諦聽佛子某甲若干人等諦聽汝今從我求受一切菩薩淨戒一切菩薩學處所謂攝律儀戒攝善法戒饒益有情戒此諸淨戒此諸學處過去一切菩薩已受已學已解已行已成未來一切菩薩當受當學當解當行當成現在一切菩薩今受今學今解今行當來作佛汝等從今身至于成佛於其中間不得犯能持否答能持三説第九請諸佛證明諸佛子快哉慶幸有此遭逢喜無障緣得受戒竟如得髻中珍寶似得優曇鉢華宜盡保任以期熟脫今更為汝虔請諸佛菩薩為作證明仰白十方法界一切諸佛諸大菩薩僧此娑婆世界南瞻部州大宗國某僧伽藍內佛菩薩前有諸佛子於我所求受菩薩戒竟惟願諸佛菩薩慈悲攝受為作證明第十示持犯之相諸佛子我今已授汝妙戒竟汝等等宜應護持不惜身命勿令毀犯我今示汝持犯之相準梵網經十重四十八輕垢戒相汝等諦聽第一不得殺生若自教殺人殺非真菩薩犯波羅夷罪汝等從今身至佛身於中間不得犯能持否答能持下皆例此答第二不得犯盜若自盜教人盜乃至鬼神物一針一草不得故盜犯波羅夷罪不得犯能持否第三不得邪淫當以清淨布施衆生汝從今身至佛身於其中間不得犯能持否第四不得妄語有則言有無則言無不得為貪己身巧生妄語不得犯能持否第五不得酤酒是昏亂之物令人飲則犯三十六失蒙蔽正性從今不得酤酒能持否第六不得説人過患及受菩薩戒人過從今不得犯能持否第七不得自讚毀他當須惡事自向己好事與他人從今不得自讚毀他能持否第八不得慳吝隨己所有悉當施與從今不得慳吝能持否第九不得生嗔一心嗔心能燒無量功德死後墮蛇中悉為嗔成從今不得生嗔能持否第十不得毀謗三寶況三寶於諸衆生有恩德從今不得毀諦三寶持否向下更為諸弟子發廣大願汝寺自昔以來凡有所作皆為自己不能普為一切衆生所以今世之中無福德智慧多不稱意如上四弘誓願即是總願向下更發別願回因向果回己向他成菩薩之德唱云受戒弟子等願以此受戒功德施法界衆生願未離苦者令得離苦未得樂者令皆得樂未發菩提心者令發菩提心未斷惡修善者令得斷惡修善未成佛者願早成佛又以此受戒功德願梵王帝釋四天門王二十八宿一切天衆日月星辰風伯雨師雷公電母五嶽四瀆江河淮濟名山大川一切龍神並願威權自在養育生靈使風調雨順五穀豐成人無橫病國有貞祥八節四時常安常樂又以此受戒功德祝延當今皇帝聖壽無疆太子諸王福延萬葉后妃采女榮愛日新卿相官班祿遷高舉州牧縣宰正化清廉司典吏曹身心吉直聚集福善資益一切又以此受戒功德惟願在會弟子住居土地禁忌百靈各鎮方隅恆施利益先亡後化若祖若孫或在三途或生善處並願速趣佛國早悟真常遠益門欄長無災難又以此受戒功德願共法界一切衆生捨此報身同生佛國悟無生忍得大神通遊歷十方供養諸佛又以此受戒功德願共一切衆生從今已往永離三惡道身永離下賤之身永離不自在身常得男子不生邊地常生中國受性香潔六根圓滿聰明正真與一切衆生作大知識作善明友作大導師聞我名者發菩提心見我形者斷惡修善聞我説者得大智慧知我心者發菩提心諸佛菩薩一切行願福德智慧悉皆圓滿仰憑大衆念誦莊嚴云云授五戒法今用南山鈔優婆塞戒經為本及傍引遺教此驟録備急未可全依初請受戒阿闍梨云大德一心念我某甲今請大德為五戒阿闍梨願大德為我作五戒阿闍梨我依大德故得受優婆塞五戒慈愍故三説第一發信心答云我已先受佛制令我常行法施梵網尚令遇異類衆生勸令發菩提心況汝殷勤三請至求淨戒者乎汝應諦聽我當授汝上所求戒遺教經云當尊重珍敬波羅提木叉如暗遇明貧人得寶又云戒是正順解脫之本若人能持淨戒則諸善功德皆悉能生當知戒為第一安隱功德之所住處然戒有多品汝所求者乃是趣善之元首出苦之要津也善生經云此戒甚難得能為沙彌大比丘及菩薩戒而作根本當知此戒勝妙若是莫可輕心而求受之我今為汝陳白三寶乞為證明護念此等令汝納戒及護戒無失衆善功德依三寶生汝當專心聽我陳白白三寶云我比丘某甲敬白十方法界佛法衆僧願大慈悲為我作證此日娑婆世界南瞻部洲大宋國某州某縣某處有求出家清信正士姓名某甲或在家者云云從我某甲求受五戒盡形壽為優婆塞願諸三寶攝受覆護得受五戒慈愍故三説二令懺悔已為汝等具白三寶攝受覆護猶如照世明燈無不知見切慮汝等無始無邊罪障障汝善心戒品不發我當為汝先陳懺悔淨洗三業當隨我言或有預曾懺悔了則云汝等雖預曾懺悔罪障重積卒難盡懺我今更為汝再三發露當隨我言我某甲稽首歸命諸佛世尊哀愍我等覆護我等我今懺悔無始劫來流轉生死百千生中無量億生或墮六趣受諸異報地獄鬼畜受如此苦常不得樂我自思尋過惑自纏不覩聖道障涅槃門閉甘露戶塞衆善道不聞正法沉沒大海有如此罪今悉懺悔願去我身無量衆毒拔我邪愚無量塵惑心意清淨作是語已五體投地或七反或三反三正受法先受歸依汝已懺淨三業善法無障宜自正心受正戒法應先為汝受翻邪三歸依翻汝無始邪信之心令汝永歸正覺之路當隨我口言胡跪合掌我某甲盡形壽歸依佛歸依法歸依僧三説我某甲盡形壽歸依佛竟歸依法竟歸依僧竟四問遮難已為汝等發正歸依永拔邪刺授汝五戒今正是時然我實凡夫傳佛聖旨既無三明洞照安知根器淳漓南山今揀人是非明發戒緣不錯故引成論云五逆罪人賊住汙尼毗尼中不聽作田為惡業所汙亦障聖道不聽出家若為白衣得善律儀不遮修行施戒等薩婆多中若有先犯五八及十具戒而犯垢重者更不得受汝非此輩人否受者實答若無便答云無五問具闕持然此五種戒法既為衆戒之本受者實難其人汝能具持此五為止一二三四耶出家者答願具持若在家者當隨意答或具或一二三四六正受戒汝無遮障已是淨器復能具足受持是真善人甚為難有汝應得戒當隨我語我某甲歸依佛歸依法歸依僧盡形壽為五戒優婆塞如來至真等覺是我世尊三説我某甲歸依佛竟歸依法竟歸依僧竟盡形壽為五戒優婆塞如來至真等覺是我世尊三説七説相汝優婆塞已納戒法竟應當為汝明一一戒相今汝識相護持汝須諦聽善諦思惟如實答問是多陀阿伽度阿羅訶三藐三佛陀説是五戒相盡形壽不殺生是優婆塞戒能持否答能盡形壽不得盜不得淫不得妄語不飲酒一一皆是優婆塞戒能持否答能一一準前初戒廣作八説護持及功德是優婆塞五戒相貌當一一如法護持勿令汙犯如惜眼目如護明珠無令毀失於五戒中隨犯一戒永為棄物於佛法中無所堪用名佛法邊人於五八十戒大比丘戒永不得受假使七佛親證亦復戒緣不發汝若有受無持遇緣破壞不如莫受當來療治若犯五戒如人已死法藥不入難可救療當聞此語日夜攝心如守堤塘勿令涓泄九遠離十五種非律儀又優婆塞盡此形壽遠離五種邪命一者賣肉二者沽酒三者賣毒四者賣衆生五者賣兵仗又遠離五事莊嚴一者香二者華三者瓔珞四者香油塗身五者香熏衣又復遠離五種放逸一者歌二者舞三者作樂四者嚴飾樂器五者不往觀聽略示十五種非律儀行一一不得故犯縱放無慚若於此等律儀未能諦了更各於本出家師咨稟相貌微細奉持盡此形壽敬事三寶增進善根精玩戒珠常令圓淨十禮佛回向次應禮佛回向當隨我言願十方法界世性六道三業罪障垢惑衆生崩顛倒山竭四流濟登涅槃道入無為國歸命敬禮盡十方國諸佛妙覺一禮願十方法界世性六道沉淪諸有長沒衆生摧破戒林灼滅邪照歸命敬禮盡十方國修多羅海一禮願十方法界世性六道小心膠固顛倒衆生頓絶偏照傾證住想永附大乘歸命敬禮盡十方國諸賢聖僧一禮次當為汝説偈稱贊汝須互跪合掌諦聽諦聽見聞獲安隱莫不信向心是故我歸依願普如世尊甚深淨戒聚功德難思議受者獲安隱福慧日夜生諸佛常護念萬行漸滿盈六度四等意普度諸群盲手足初莫犯節言慎所行常樂在定意是真優婆塞質直離諂曲常與賢聖俱愛衆猶養己是名真菩薩念誦作處世界結之示人念佛方法并悔願文夫大覺世尊以四種法度諸衆生一者示視相好令觀察者發菩提心二者示視説法令得聞者開悟入道三者示視化事令見聞者獲諸法利四者名號流布十方令其聞者執持繫念罪滅善生而得度脫今言念佛者或專緣三十二相繫心得定開目閉目常得見佛或但稱名號執持不散亦於現身而得見佛此間現見多是稱佛名號為上如懷感法師一向稱阿彌陀佛名號而得三昧現前見佛故今普示稱佛之法心須制心不令散亂念念相續繫緣名號口中聲聲喚阿彌陀佛以心緣歷字字分明使心口相繫若百聲若千聲若萬聲若一日若二日若七日等但是稱佛名時無管多小並須一心一意心口相續如此方得一念滅八十億劫生死之罪若不然者滅罪良難若恐心散須高聲疾喚心則易定三昧易成故感法師決疑論中引大集日藏經云小念見小佛大念見大佛論釋曰大念者大聲稱佛也小念者小聲稱佛也斯則聖教有何惑哉奉勸今諸學人唯須厲聲念佛三昧易成小聲稱佛遂多馳散此乃學者方知非外人能曉也已上正文此又與天台智者大師釋觀經中罪人臨終十念稱佛滅地獄火得生淨土其意宛同如云是心雖少時而力猛利諦心決斷勝百年願力是心名為大心不惜身命名為健人也彼云大念此云大心彼云厲聲此云猛利不惜身命彼云小聲多散此云勝百年願力豈非皆令猛利大聲稱佛雖少而功多若小聲稱佛雖多而功少故云十念能勝百年今時多見世人稱佛都不精專散心緩聲遂致現世成功者少臨終感應事稀故今特示此法切勸凡念佛時一心不亂高聲唱佛聲聲相續不久成功也念佛方法竟每日念佛懺悔發願文從我昔所造已下懺悔等文出普賢菩薩十大願王經中我今稱念阿彌陀真實功德佛名號惟願慈悲垂攝受證知懺悔及所願我昔所造諸惡業皆由無始貪嗔癡從身口意之所生一切我今皆懺悔願我臨欲命終時盡除一切諸障礙面見彼佛阿彌陀即得往生安樂剎彼佛衆會咸清淨我時於勝蓮華生親見如來無量光現前授我菩提記蒙彼如來授記已化身無數百俱胝知力廣大遍十方普利一切衆生界秪消直誦此偈不須別更發願也修盂蘭盆方法九門近有印本別行稍有添削請知釋名敘起第一造盆正法第二所供勝田第三施主運懷第四受供法儀第五慈親受益第六道俗同遵第七斥非顯是第八問答釋疑第九釋名敘起第一盂蘭梵音漢言倒懸盆此方音食器也晉武時剎法師翻名也又云灌臘經惠帝時法炬師立名也又云報恩經所以取行行之行而立名此師不出名有唐終南山圭峯禪師具題云救倒懸盆經斯由目連之母受餓鬼之身命似倒懸佛令設供蒙福解脫故以名之也本起者昔迦葉此云定光佛時目連名羅卜母字青提卜欲他行囑母待客毋為慳吝假設賓筵以誑其子由是五百生來慳心相續備歷衆苦乃至今身仍為母子復墮餓鬼發起斯經也造盆正法第二經云此小經二紙成文具飯百味凡有味食五果一核果二膚果三穀果四𥢶果五角果亦大略之名汲灌湯沐盆器牀敷臥具器具香油挺燭香油可以塗身又油燭可以續明盡世甘美以著盆中再囑飲食令盡精華餘物準此可知慧淨三藏云汝須物華四事一房舍二衣服三飲食四湯藥盆美八珍食之米麵味之鹽醋果之果奈菜之芥薑密師疏云不必雕鏤金玉剪割繒綵高聳欄架等也誡奢淨土大盆經此大乘經四卷成文云十六國王聞佛説目連救母脫餓鬼苦生天道中母子相見爾時諸王各勑藏臣為吾造盆即時造五百金盆如是七寶各作五百盆盛滿百味飲食事事如法又造五百金鉢盛滿千色華如是七寶各五百鉢盛滿千色百木香千色紫金華千色黃金華千色赤蓮華千色青木香千色白蓮華一一香華各五百鉢王見如法即勑兵臣十四萬衆俱到祇園寺奉盆供并七寶盆鉢俱施佛僧有須達居士毗舍佉母二百優婆夷波斯匿王末利夫人等頒宣國內依目連盆法亦如前各造七寶盆七寶鉢皆悉五百盛滿飯盛衆華一一嚴事復以五百紫金輿五百黃金輿王及夫人等即共盛滿五物事事具足於是嚴駕十八萬衆俱至佛所奉盆及輿供養佛僧今詳二經造盆之法由人華儉既四事百物咸可充供理無常調若且直論盆者若飯饌羮菜果實各著一盆若香華湯藥皆用鉢器盛之此依大盆經若云盡世甘美以著盆中此不分盆鉢此準小盆經若欲年年奉盆不絶應別造盆以擬常用安清淨處慎盛餘物造盆之材金銀銅鐵木瓦無在但取精嚴為上耳所供勝田第三經云供養十方大德衆僧當此之日七月十五日僧自恣時一切聖衆或山間禪定或樹下經行或六通自在聲聞緣覺或十地菩薩大人權化比丘在大衆中皆同受飯釋曰自恣僧略有五種最勝一自恣滅纍戒淨勝二三月加行禪定勝三歲滿諸佛歡喜勝四凡聖小大和合勝五十方無邊廣攝勝供養此僧所得功德可勝言哉施主運懷第四欲修妙供先善運心當念慈親昊天恩大若非妙福何以報酬福境至尊非信莫及然僧涉凡聖遐括十方奉供之心理無局限必使一香一味一粒一果分通十方願十方僧同來受用故三藏云歷十方而運想澄一心而供養心既無限福亦無涯於聖於凡無厚無薄等心誠敬以諸聖人示作凡僧混和難測不得於中起分別心縱是舊識亦不得測量持戒毀戒有德無德但一心供養勿生異想梵網經云別請五百羅漢菩薩僧不如次請一凡夫僧準此而思運懷普等始獲僧福也於一一凡聖僧邊獲得僧福其一僧福者如經供養觀世音得福無邊況衆僧乎受供法儀第五經云時佛勑十方衆僧皆為施主家呪願願七世父母行禪定意然後受食初受食時先安在佛前塔寺中佛前衆僧呪願竟便自受食已上經文釋曰經文安布似如不次必先送盆安於塔寺佛前次同衆僧圍盆呪願後便各至座座行禪定意各從禪起受彼盆飯問禪定門多行何禪定答經文通漫準應各隨所習如九旬道業豈過戒定慧耶福報檀那莫若禪定經云如貧窮人供養滅定比丘此人頓捨窮苦受大富樂故今受供勸行禪意也至受食時唱等供已各更作食觀然後方食如南嶽禪師偈云此食色香味上供十方佛中奉諸賢聖下及六道品等施無差別隨感各飽滿令諸施主得無量波羅蜜又云此食色香如栴檀風一時普熏十方世界凡聖有感各得上味六道聞香發菩提心於食能生六波羅蜜及以三行作是觀者施者受者俱獲妙益又復應知一食之內正意默然而食不得雜想雜語自壞壞他為損非輕餘可意裁慈親受益第六佛語目連汝母罪根深結非汝一人力所奈何汝雖孝順聲動天地天地神祇邪魔外道道士四天王神亦不能奈何當須十方衆僧威神之力乃得解脫目連之母應時蒙福便脫餓鬼一劫之苦又云現世父母六親眷屬得出三途之苦衣食自然此云現世者生身父母也異乎遠世若父母現在者福樂百年無苦惱之患乃至七世父母脫苦生天又大盆經云波斯匿王父母免七十二劫生死大苦又若準大涅槃等經受報無盡不可備云道俗同遵第七經云若國王大臣宰相三公百官庶民比丘比丘尼行慈孝者皆應為父母乃至經末云比丘四輩歡喜奉行又大盆經云十六大國王末利夫人須達長者等及毗舍佉母二百優婆夷頒宣國內皆斆目連造盆王及夫人與十四萬衆俱到祇園奉供若乃教流東夏始晉武剎法師翻譯已來莫知其誰也但聞昔南齊高祖常於七月十五日送盂蘭盆往諸寺供自恣僧又顏氏家訓誡囑子孫七月十五盂蘭盆齋望於汝等又有唐西明慈恩等寺國家每送盆及種種雜物供獻衆僧又圭峯宗密禪師自云多載修崇年年不闕又造疏講經令果州充縣耆艾斆修奚及今聖宋至道初詔兩街僧録令進法式以修盆供仰報慈親于時正教大師省才撰義應詔云云斥非顯是第八吳越之俗亦存盂蘭之設但名下喪實良可痛哉每至此日或在本家或寄僧舍廣備蔬食列祀先靈冥衣紙錢憑火而化略同簠簋之薦未干蘭供之羞豈知本為目連不能餉母之食哀投調御始開救苦之方推乞福於衆僧專奉盆於三寶如其反此未知于何故經云大目犍連始得六通即以道眼觀見亡母生餓鬼中不見飲食皮骨連立目連悲哀以鉢盛飯往餉其母食未入口化成火炭遂不得食目連大叫悲號乃至佛言非汝一人力所奈何天地神祇邪魔外道四天王等皆莫奈何當須十方衆僧威神之力乃得解脫故教以奉盆供養十方大德衆僧請尋經意足見是非代變風移一至于此問答釋疑第九問目連何不用阿難所請呪法令母得食呪法即西然經也答起教逗機各有由矣如世種種方藥為對種種病故彼經且云得食未明度脫此中別示苦緣要令升出爾問奉盆之外更嚮先靈何妨答奉盆得脫更嚮何鬼如人免罪出獄自然歸家又更送食耶既蒙福生天復云嚮鬼雖欲從命恐成矛盾問若然者一反修供便得生天何故佛令年年奉盆答多益盆福彌助人天設復苦報未除理宜頻薦惡道有輕重孝心有厚薄問若許若有未除何妨更祭答苦有三途四趣不例為鬼況鬼有等差不例得食如目連母豈得食耶唯宜薦福苦樂皆資若執祭儀未窮鬼道故中阿含經云若為死人布施祭祀者布施如奉盆也并其祭祀雙行正如前問若生餓鬼者得食餘趣不得由各有活命食故若親族不生其中者但施自得其福勸施不勸祭也準意應云人死若生餓鬼及不生者但行布施蒙福解脫不須祭祀方成了義應知猶是中含隨情許祭餓鬼然雖從許意在全奪問造盆安家中佛前供養彼請僧歸家食得否答理應不通在家須送往塔寺據經云初受食時先安在佛前塔寺中佛前恐濫在家佛前故重云塔寺爾問奉盆并盆施耶答自量施力問送盆人并官客將何物延待答此如法苑六十二卷初説請往撿之
