body:
  text: 天竺寺懺主慈雲大師勑諡法寶大法師述住持傳天台教觀五世法孫慈明大師慧觀重編放生慈濟法門并序梁朝高僧放生文施食正名施食法附施食文施食觀想答崔育材職方所問放生慈濟法門并序儒冠五常謂之仁釋御四等謂之慈皆惡殘去殺推惠廣愛之謂也然後果五福之曰壽證四德之曰常實唯不殺放生之大統也始悟九居之中無常之理為殺業之故釋迦金人八十示滅信相以不殺見疑於是明矣洎充虎濟魚之為行數塵滴海之比壽不殺果知其常斯又明矣推此欲登仁壽之鄉常樂之場久而彌芳必須以放生則蚤蝨之咸恤蜎螟之遂康不殺則草木等愛枝葉靡傷然後始可也人何逆甚而返以殺畜肥體乃望長年豈異續火以水增冰以湯何其遼矣試論之曰彼之含血既均於己計身惜命豈復遠哉有識之士取譬諸身孰敢殺身取譬諸命孰不保命矧如佛言莫非父母妻子循環之報且殺且噉其可忍乎是知暴凶嗜殺之徒嬰三途之極酸然後殘疾短齡之應而應之其將何歸嗚呼深可憐愍者也痛莫奈何豫因將二三子往翠巖練若修法華三昧路由舟楫衆買水屬放之兼廣流水品疏講經獨不果也但臨生類口授法句觀者飾謬謂倫貫盡旨山行之次請析簡書之豫曰蓋出我衷非由舊章適時之言那可承用辭之不已備而端輗目為慈濟法門作七章分別事理聊足但其言質用者更可裁飾七章者敘由一呪水二請加三歸依四稱佛五說法六懺願七一敘由章法師當臨生類而坐合掌在胸慈眼視之生憐愍心罷云汝等異類初不自知妄源濫觴於己心業海波濤於一念念由妄起心逐境流貪著前塵如膠著草背真既遠迷惑轉深攝之不還拔之不出貪嗔為本起衆業因常趣三途竟不知返於瞋重者趣火途道於貪重者趣刀途道於癡重者趣血途道等分重者三途遍歷動經塵劫無解脫期汝今此類本多愚癡起由癡業故墮畜生中世世受身皆畜所攝報命欲盡先遭羅網或中弓刀或相吞噉剝皮噬肉唯血盈流名血途道其苦無量不可具言且如今日將入火湯美他喉舌臨其死怖深可痛情遭遇菩薩檀越捨己珍財贖汝身命汝苦厄施汝無畏汝今勿怖生安隱心仍請吾等授汝三歸說深妙法令汝身命便謂已得第一之利更聽法門實當幸甚當攝一心諦聽二呪水章當以淨器盛水攝定自心誦穢跡呪七遍或多遍誦已將楊枝散酒生命誦呪前作此言所言穢跡呪者大圓滿陀羅尼神呪穢跡真言唵𠲽咶啒㖀摩訶鉢羅合恨那𠵨吻什吻微咭微摩那栖嗚深暮啒㖀𤙖泮泮娑訶然將欲授汝三歸及正法義切恐汝等異類惡業所熏形體臭穢三實至尊如何可近吾有祕密呪法呪水令淨散灑汝身滌去羶穢兼能潛洗汝心令成法器作是語已即便呪水灑之三請加章凡師道力淺薄異類神識昏愚故須請三寶冥加令彼了別言語領受法義經云我若向畜生自得大智慧又云聖欲與知使蜫蟲能知是故請加深有由也先作是言我今已為汝等浣去羶穢堪近三寶至尊汝等積劫諸根厚重昏散纍障雖陳法句云何能知吾今為汝殷勤三請十方諸佛菩薩神力冥加使其頓豁昏情朗聞正法又聖應物有顯有冥顯則令汝見聞冥則潛資識性今請冥加破汝愚暗使受三歸不唐其意作是語已五體投地敬禮三寶一心存念深起懇側若空間處無像只用合掌向空白聖唱云我比丘某甲敬白十方諸佛釋迦本師寶勝如來正遍知者觀音大士大悲熏心彌陀至尊勝大慈曰惟願他心道眼真實見知我今順諸佛慈行菩薩行為彼畜生道報苦聚衆生授與三歸說深妙法但緣此類本為愚癡故墮殊形長嬰苦受不識三寶不聽法言縱有暫聞愚故不解今請三寶同與冥加彌勒慈光潛輝暗識觀音慧力願割昏情使彼耳聽法音歸依三寶慈愍故三說後復坐四歸依章當生慈心目視口言三業勤重存念三寶滿虛空中慈加物類不得容易將恐無益切囑切囑想已而作是言說云汝等異類當生慶幸之心三寶至尊慈善根力加被於汝應當善攝諸根一心受法汝先憶念宿何惡業今受此身但由不信因果不歸三寶內縱吾我外假惡緣晝夜貪瞋相續不斷心純是惡與惡相應隨順歸依邪師惡黨邪毒深入正念不生故此邪心永斷信種信若不起諸佛常滅法輪不轉是故衆生長劫受苦吾今教汝歸依三寶起正信心翻汝前惡令識正法然歸依之法必須三業克全一心歸向但汝等身口惡報不得自在身不能曲折口不能解言唯有意業而能存念意唯總䇿若能一心不散亦得全分歸依汝當一心存念三寶作歸依想所言三寶者即是所依無上之境先當為汝略說三寶名義汝當審識然後歸向一者總相三寶二者別相三寶一總相者謂佛名為覺法名不覺僧名和合此之三寶而但一體無二無別在修在性因果無殊今論歸命當從果說如普賢觀經云毗盧遮那遍一切處其佛所住名常寂光常樂四德等所說毗盧遮那即佛寶寂光即法寶常樂即僧寶又涅槃經云佛即是法法即是僧僧即是如來即此義也三即是一三一圓融不可得說強名一相二別相三寶者即普賢觀經三歸文云十方諸佛願證知我大德諸菩薩願為我伴我今依大乘經甚深妙義歸依三寶佛即佛寶菩薩即僧寶大乘妙義即法寶以此對前一體之義作二種相說亦只是一種無別總名一乘圓融三法不同小乘三歸止血火刀致人天路今之所說三歸之相能令汝等離二種生死至常住道何況人天及三途報汝當信受如是名義作究竟歸依作是語已不起座間合掌向空唱三歸依相專精一心如法羯磨云十方諸佛現為我證大德諸菩薩願哀念我今我依大乘經甚深妙義歸依佛歸依法歸依僧作是三唱已復再唱云歸依佛竟歸依法竟歸依僧竟佛生甘蔗種滅已不復生若人歸依佛法僧得免地獄苦故今汝等類究竟誓歸依乃至得菩提常得無忘失假使地獄火焰熾燒汝心終無一念間違背於三寶唱了不起座復作是言五稱佛章汝異報之屬已歸依三寶正直之道深自慶快生安隱想永更不怖三惡險道次當為汝稱如來十號令知諸功德妙味故金鼓經云專稱寶勝如來具足十號不稱餘佛者我今唯依彼經云過去有佛名寶勝如來具足十號若有衆生臨命終時聞我名者即得往生三十三天乃至成佛汝當承佛威神一心諦聽作是語已當合掌一心恭謹稱七遍或多遍亦得唱云南無寶勝如來應供正遍知明行足善逝世間解無上士調御丈夫天人師佛世尊七遍寶勝如來常住不滅大慈普救願賜證知聞稱此名當憶本願使聞名者即得生天及諸佛土哀愍故六說法章法師欲說時當自思惟甚深妙義然後如思而說次第不亂此但略說而已復次應為汝等說深法門淨名雖云不觀人根不應說法法華則云但以大乘而為解說令得一切種智涅槃唯以一藥遍治衆病金光明為魚說甚深十二因緣而得記莂調達地獄受決龍女畜生成佛豈是權小之力乎我今為汝但直除滅三途報不說餘乘唯示十二因緣常住妙理汝等諦聽善思念之云何十二因緣所謂無明緣行行緣識識緣名色名色緣六入六入緣觸觸緣受受緣愛愛緣取取緣有有緣生生緣老死憂悲苦惱此備歷三世因果此十二因緣只此無明愛取名煩惱障行有二緣名業障餘悉是報障如是三障性實三德煩惱即般若德業障即解脫德報障即法身德法身究竟般若解脫亦究竟般若清淨法身解脫亦清淨解脫自在法身般若亦自在一究竟一切究竟乃至一自在一切自在衆生理具障覆情迷聞名觀察相似得見隨分開顯乃至究竟此三種法畢竟無異汝當如是而思如是而證等無有異是名甚深十二因緣說法廣略隨意未必專念此文但不用說三乘義即得也七懺悔章當更焚香存念三寶代為物類懺悔發露合掌一心作是語言上來為汝受三歸依稱佛十號說深妙法三種障義結成行者翻邪惡心即成戒義稱號念佛三昧結成定義聞法解了此即慧義應行此戒定慧名究竟一乘之行非歷三乘漸次之位戒成斷德三昧成解脫慧即般若一相三寶於是復成汝等夙植何善今得值遇甘露法味當自慶快不久即出三途不久當成佛道今更為汝懺滌罪垢去汝遮障令速開悟即得解脫故帝釋一念懺悔滅永劫傍生之難慈童剎那慚愧頓離地獄之苦是知懺悔名第一法又願汝捨此身得生淨土我聞阿彌陀經說薜荔蜎蜚皆生我國信知異類亦有往生之理汝勿自疑當一心信受我為對三寶一心陳辭作是語已對三寶前一心合掌唱云我比丘某甲今為傍生類發佛大慈悲懺彼六情根無始業障海眼根著諸色耳界聞亂聲鼻染一切香舌生諸惡刺身如機關主六賊游戲中心想如猿猴無有暫停時如此等六法名為六情根一切業因緣皆從妄想起妄想如幻焰亦若空中花迷倒不覺知為諸惑業縛永墮三途界沒在衆苦中不聞正法音何曾知懺悔惟願十方佛菩薩衆大師慈力與冥加令其知發露無始一切惡今日悉消除畢故不造新常當修梵行未脫傍生難餘命願安樂筌網及虞羅願不相值遇飲隨時足飢渴永不逢相見起慈心願不相吞噉常承三寶力誓脫衆塵勞畢此苦類身願生諸佛國彌陀廣慈願不捨一切生觀音慈願深常游五道界願舒五色臂我出輪回儻若命終時願垂親接引救我厄難者菩薩大檀那憫我臨湯火捨財贖我命須彌與大海徒自謂高深檀那今日恩高深不可比現生增福壽眷屬悉團圓來世受身時願同生佛國和南賢聖衆唱已三歸而終更不念誦回向也上來雖曰七章辭理廣略之失兩俱未詳或有可取請用者更自斟酌但不失大綱即得也應知不事文章但順慈濟之理直寫𮌎間常用之語耳讀者勿起譏誚之毀也梁朝高僧放生文梁朝高僧法名慧集遍歷州府旋燒兩臂乞錢放生或遠於鄽市村落無乞錢處遇魚船者輒便翻於水中將身抵魚人毆打行化至睦州兩臂燒盡遂便命終故今𦘕彼形容遍示信者彼雖出家痛癢何異尚燒身分救濟衆生世人云何殺他養己無慈愍心未能捨身代命且應怒己莫殺未能割肉飼虎且應忍口莫食嗟見當州居人競買糠蝦螄螺蝦蟇鰍鱓鴿微細形類凡一餐之費計幾頭數當來償命有何了日嘗將一升蝦略數有三千頭或若一食一升殺三千命苦哉痛哉是何惡業令汝如此食噉衆生美在一餐苦嬰萬劫願各且止勿自造殃故特勸懲凡有命者勿殺勿食且應忍淡餐度時若思念魚肉當觀自身尚不能受一針之痛云何將彼屠割煮炙縱殺一命資我百年寧可自亡不令他死何況無辜而食噉耶思之戒之施食正名施食一經凡兩譯共三名一曰救面然二曰救拔焰口三直云施餓鬼食今吳越諸寺多置別院有題榜水陸者所以取諸仙致食於流水鬼致食於淨地之謂也世言施水陸無主孤魂者理出誘俗言不涉教有題解食者所以取諸摩提偉器之度顯變之大非器食于其中也有題冥道者所以取諸鬼類別他趣也天其冥乎人其冥乎畜其冥乎夫燕以蟲粒自充牛羊以水草而足泥黎咀銅鐵而不暇提婆飲甘露而有餘生生之方既殊服味之品萬計唯其鬼黨伺人廟食故大慈誨以密教詛少令多而博濟之至若山海之仙莫貴匪人莫高匪天不我類焉且能顯晦饗夫粒食于以求之但小出鬼之上梁天監天下止殺乃用相似佛法設六道之祭代江東淫食菜羮免我犧羊今之承之既非彝訓不能無考故牟尼有言曰人死祀之魂為鬼則歆其食矣他趣亡諸又諸無疑聖弟子曰六趣各有自爾之力唯鬼能變食耳詩不云乎不愆不忘率由舊章故大聖名之必可言也言之必可行也過此已往則未知所裁施食法附先和會經文者經既兩譯略有異同實叉譯云若欲施婆羅門及仙等食婆羅門及仙須分二類似誤不空譯云施婆羅門仙不云及仙此文似正若作二類婆羅門是人不合同鬼施食實叉呪仙食七遍與鬼同不空云二七遍二七為正實叉云餓鬼得摩伽陀斗四斛九斗飲食不空云七七斛食譯者不同不須和會據理取飽滿為度經云施食若晨朝及一切時悉無障礙準毗羅三昧經云早起諸天食日中三世佛食日西畜生食日暮鬼神食與此經如何和會釋曰應有多意且作一解毗羅據理定說此經隨時不定說何者餓鬼飢急苦若倒懸得食便施何俟終日故云一切無礙也若天仙及佛須依毗羅定說過中之後決不可以飲食雜果供養也經不說人者準人道既貴合在中前食故人有夜食不節者自同鬼畜耳又實叉唯用一呪不空加四如來名等今且依實叉貴易行故一呪之力能兼一切不俟其諸又有甘露經及一小卷者並失譯不可用次正示方法者經云若欲作此施食法者先取一淨器盛以淨水置少飲食及諸餅飯以右手按呪滿七遍陀羅尼曰曩謨薩嚩怛他引一㜸跢嚩路引枳帝二唵三三跋囉四三跋囉五吽六呪竟彈指七下展臂將食器瀉淨地上方法訖實叉云於門內立展臂戶外置盤淨地不云瀉作此施已於其四方有百千俱胝那由他殑伽沙數餓鬼一一鬼前各有摩伽陀國七七斛食受此食已悉皆飽滿是諸餓鬼悉捨鬼身生於天上其施婆羅門仙及供養三寶尋經易見當誦呪時更加觀想彌為盡善想器中飲食色味無盡遍施不匱如淨名室中一盂香飯充足衆會無所乏少亦如涅槃純陀少飯充雙林大衆不多不少信此陀羅尼不可思議飲食色香亦不可思議衆生心亦不可思議夫何惑哉三勸修者此經真長生之術也阿難尊者延三日必死之命滿百年具壽之康五果現臻二嚴當備五果者色力辨安壽二嚴者福慧也實在乎施一摶之食也經云若常以此真言加持飲食施餓鬼者則同供養百千俱胝如來功德等無差別壽命延長壽也顏色鮮白色也具足大力力也威德強記辨也一切非人夜叉羅剎不敢侵害安也又能成就無量福德壽命二嚴也前五果中已有壽命理無重出信知此中以慧為命五果二嚴在文炳然若此大矣哉能於少頃作大佛事能以摶食作大施會常生梵天乃至成佛一日既爾何況一月何況一年何況一生豈有智人聞而不信信而不行者乎施食文以銅器盛飲食淨水灌之當臨食器面東而立起慈悲心稱三寶名三說及大慈觀世音菩薩三說破餓鬼障稱竟以左手擎食右指接食器心存目注呪曩謨薩嚩怛他引一㜸跢嚩路引枳帝二唵三三跋囉四三跋囉五吽六誦七遍竟彈指七下然後展手垂之起無畏施良久即以食瀉之置淨地上合掌呪祝云我沙門某甲今誦無量威德自在光明勝妙力陀羅尼加持飲食普施餓鬼之衆惟願面然鬼王大權勝士慈善熏心普攝無量無邊恆河沙數餓鬼之衆悉來我所受我所施無遮無礙清淨法食如經所說各各皆得摩伽陀國所用之斗七七斛食一一充飽無所乏少頓皆消滅長劫飢渴倒懸之苦身心歡喜發菩提心應時即得心樂三昧疾捨鬼身生佛淨土速圓種智廣度衆生我此施食功德如世尊言即與供養無量百千俱胝恆河沙諸佛正等無異願以此福回向法界莊嚴菩提願共衆生同得圓滿檀波羅蜜遠離一切生死飢渴速得究竟菩提涅槃二無上果當施衆生無盡法食云云施食觀想答崔育材職方所問先略述大意次作觀想大意者飲食具色香味觸法五塵唯闕聲耳於五中味塵為主味依色住亦可觀色為境大品云色中無味相凡夫不應著色中無離相二乘不應離即是非味非離顯色中道法界何法不備是故一色具一切色亦具聲香等一切諸塵及一切法一切心隨感而施何法不現淨名經云譬如諸天共寶器食隨其福德飯色有異止觀大意妙境云一一塵中一切塵一一塵中一切心一一心中一切剎等云云釋論云菩薩呵色見色實相到色彼岸即是見色中道若分別色具種種相即是見色俗諦俗即是空即是見色真諦亦是見色三諦既了色即是法界即是實相即是中道三諦等即應了色即是陀羅尼當知所施飲食色之與味即陀羅尼體也一食出無量食等即陀羅尼用也經云此陀羅尼名無量威德自在光明勝妙力此復以三德為義無量威德自在解脫德也光明般若德也勝妙法身德也力是總結力用也自非法身勝妙之用安能一䬸充彼巨億萬數塵沙之衆乎問若食即是陀羅尼者何故更須呪乎答實爾諸佛聖人證此一塵法界故能以自在之力稱性而用何俟更呪淨名取一鉢香飯遍飯三萬二千無所乏少豈藉呪乎三乘賢聖食此飯者悉入正位或增道損生其香乃消豈非具一切法也但衆生在迷於理既惑於事亦礙於自在法中而自桎梏如水為冰安責水用故聖人方便密說此法名陀羅尼令誦以呪之呪句與色味法性相應能令鬼神見食無量經云如人得一斤石汁變千斤銅為金物性相感故也問施食正名中云六道各有自爾之力唯鬼能變食者何不直施其食任其自變何假呪乎答鬼有多種不必一例略出三類一者無財鬼由無福德不得飲食故二者少財鬼少得淨妙飲食故三者多財鬼多得淨妙飲食故此三類復各有三種初無財鬼三者一炬口鬼謂火炬炎熾常從口出二者針咽鬼謂腹大如山咽如針孔今經中正為此二種傍兼一切三臭口鬼謂口中腐臭自惡受苦二少財鬼亦三種一針毛鬼針如針利行便自刺二臭毛鬼毛利如刺自拔受苦三大癭鬼咽垂大癭自決噉膿三多財鬼三種者一得棄鬼謂常得祭祀所棄食故二得失鬼謂常得巷陌所遺食故三勢力鬼謂夜叉羅剎毗舍闍等所受富樂類於人天但為惡道所攝所言能變食者即是第三多財中三種鬼也又三中前二則劣後一為勝亦只能及於自類不能有所塵濟今呪力所變能令九種鬼中平等皆得上妙飲食無有差別又呪食者名為法食法隨食入如服良藥能差重病身康受樂經云捨餓鬼身得生天上即此意也第二作觀想者行人既了諸法無非法界一多無礙復信陀羅尼力不可思議至施食處安詳而立先起慈心憫彼飢渴我今將欲大施先想其處廣博嚴淨其地平正作一施場能容受無量餓鬼之衆次想食器隨我呪力如摩提國大斛之量滿中甘美飲食如天甘露一器為無量器滿其施場界塞周遍一一鬼前皆有我身誦呪彈指慈心展臂授器施與隨意滿足想呪之聲普聞一切彈指之聲驚覺幽沉之處一切餓鬼從四方來無所障礙現前受令受想心明了猶同眼見然後不移此想心一一為其說法或稱佛號或呪願等隨意作竟而退問如上觀想據何處文作答此經雖文略不說據餘呪部印契觀想隨呪句句而作不可一念差舛此呪亦令以手按器呪之七反呪已彈指七下非全不作法今加觀想彌益其功問作此露布次第觀想準何處作答準天台三種觀中歷事觀作既云歷事隨彼事相而設觀想故無常科今準天台供養三寶運香華觀想大旨一同也又南嶽禪師食觀偈云此食色香如栴檀風一時普熏十方世界凡聖有感各得上味六道聞香發菩提心於食能生六波羅蜜及以三行請詳此觀何俟致疑又淨名經云以一食施一切供養諸佛及衆賢聖然後可食豈非食觀問變食由呪力何用觀乎答觀扶於呪彌益其美又呪是他力觀是自力但呪而無觀譬如盲者使人作大施會但信他語云得食不得食等自終不見若加觀想如有目者使人作大施會一一眼見不由他語呪如使人觀如眼見金剛般若云若菩薩心住於法而行布施如人入暗則無所見若不住法而行布施如人有目日光明照見種種色今無觀者只作事行如人入暗也觀稱法界無住即是無住行施其福譬如十方虗空不可思量也凡作一切佛事乃至獻一華一香皆能作觀者不滯生死一一流入薩婆若海中少戒少施皆成佛果良由茲矣
